plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'io.github.jumosqu12.screenplayarchitecture' version '2.0.1'
}

group 'co.edu.udea.certificacion.auto'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.1.0'
    serenityCucumberVersion = '4.1.0'
    lombokVersion = '1.18.22'
    junitVersion = '4.13.2'
    hamcrestVersion = '1.3'
}

dependencies {

    implementation "net.serenity-bdd:serenity-core:$serenityVersion"
    implementation "net.serenity-bdd:serenity-junit:$serenityVersion"

    implementation "net.serenity-bdd:serenity-screenplay:$serenityVersion"

    implementation "net.serenity-bdd:serenity-screenplay-webdriver:$serenityVersion"

    implementation "net.serenity-bdd:serenity-cucumber:$serenityCucumberVersion"

    implementation 'org.slf4j:slf4j-simple:2.0.5'

    testImplementation "junit:junit:$junitVersion"

    testImplementation "org.hamcrest:hamcrest-all:$hamcrestVersion"

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"

    implementation 'org.apache.commons:commons-dbcp2:2.12.0'
}

test {
    useJUnit()
}


